<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL Live Portal</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#090d16;color:#eef2ff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{max-width:420px;width:100%;background:#121927;border:1px solid #243044;border-radius:14px;padding:20px;text-align:center}
.st{color:#94a3b8;font-size:13px;margin-top:8px}
a.btn{display:inline-block;margin-top:14px;background:#2563eb;color:#fff;text-decoration:none;padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h3>GLOBAL Hub Portal</h3>
  <div class="st" id="msg">Live tunnel connect ho raha hai...</div>
  <a class="btn" id="openBtn" href="https://globallinkshare.github.io/GLOBAL/" style="display:none">Open Live Hub</a>
</div>
<script>
const PORTAL="https://globallinkshare.github.io/GLOBAL/";
async function checkAndGo(){
  try{
    const r=await fetch("url.txt?t="+Date.now(),{cache:"no-store"});
    const target=(await r.text()).trim();
    if(target && target.startsWith("https://")){
      const b=document.getElementById("openBtn");
      b.href=target;
      b.style.display="inline-block";
      try{
        const pr=await fetch(target+"/api/files?ping="+Date.now(),{cache:"no-store"});
        if(pr.ok){location.replace(target);return}
      }catch(e){}
      document.getElementById("msg").textContent="Tunnel reconnect ho raha hai, dubara try kar rahe hain...";
    }
  }catch(e){}
  setTimeout(checkAndGo,1800);
}
checkAndGo();
</script>
</body>
</html>
